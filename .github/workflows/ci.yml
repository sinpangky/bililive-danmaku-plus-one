name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Package
        run: node scripts/package.cjs

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-echo-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  fedora:
    name: Fedora 44
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora runner tools
        run: dnf install -y bash git tar gzip xz zip unzip which nodejs npm

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Package
        run: node scripts/package.cjs

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: danmaku-echo-fedora
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
