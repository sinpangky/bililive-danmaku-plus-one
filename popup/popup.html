<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>弹幕回声设置</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="设置导航">
        <div class="brand">
          <img class="brand__mark" src="../assets/icons/icon-128.png" alt="">
          <span class="brand__copy">
            <strong>弹幕回声</strong>
            <small id="version">v1.1.1</small>
          </span>
        </div>

        <nav class="nav-list">
          <a class="nav-item is-active" href="#general-settings" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25A3.75 3.75 0 1 0 12 15.75 3.75 3.75 0 0 0 12 8.25Z"></path><path d="M19.1 13.2c.06-.4.06-.8 0-1.2l1.46-1.13-1.75-3.04-1.72.7a7.3 7.3 0 0 0-1.04-.6L15.8 6.1h-3.5l-.26 1.83c-.36.17-.7.37-1.03.6l-1.72-.7-1.75 3.04L9 12c-.03.4-.03.8 0 1.2l-1.46 1.13 1.75 3.04 1.72-.7c.33.23.67.43 1.03.6l.26 1.83h3.5l.26-1.83c.36-.17.7-.37 1.03-.6l1.72.7 1.75-3.04z"></path></svg>
            <span>常规设置</span>
          </a>
          <a class="nav-item" href="#platform-connections">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx=".75"></rect><rect x="14" y="4" width="6" height="6" rx=".75"></rect><rect x="4" y="14" width="6" height="6" rx=".75"></rect><rect x="14" y="14" width="6" height="6" rx=".75"></rect></svg>
            <span>平台详情</span>
          </a>
          <span class="nav-item is-disabled" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"></circle><path d="m12 7.8 1.3 2.64 2.92.42-2.11 2.06.5 2.9L12 14.45l-2.61 1.37.5-2.9-2.11-2.06 2.92-.42z"></path></svg>
            <span>弹幕收藏</span>
          </span>
          <a class="nav-item" href="https://github.com/SadUnicorn171/danmaku-echo" target="_blank" rel="noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"></circle><path d="M12 10.75v5"></path><circle cx="12" cy="7.75" r=".6" class="filled"></circle></svg>
            <span>关于</span>
          </a>
        </nav>
      </aside>

      <section class="main-area">
        <header class="topbar">
          <h1>常规设置</h1>
          <div class="topbar__actions">
            <div class="resource-links">
              <a href="https://github.com/SadUnicorn171/danmaku-echo#使用方法" target="_blank" rel="noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25"></circle><path d="M9.9 9.45a2.25 2.25 0 1 1 3.55 1.83c-.9.63-1.45 1.1-1.45 2.22"></path><circle cx="12" cy="16.25" r=".6" class="filled"></circle></svg>
                <span>帮助</span>
              </a>
              <button id="feedback-copy" class="feedback-copy" type="button"
                data-email="2926074960@qq.com" title="点击复制反馈邮箱"
                aria-label="复制反馈邮箱 2926074960@qq.com">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14v9.25H9.25L5 19z"></path></svg>
                <span>反馈</span>
                <code>2926074960@qq.com</code>
              </button>
            </div>
            <label class="master-control" for="enabled">
              <span>全局状态</span>
              <input id="enabled" type="checkbox" role="switch" aria-label="启用弹幕回声">
            </label>
          </div>
        </header>

        <main class="content-canvas">
          <div class="settings-container">
            <section id="general-settings" class="settings-section" aria-labelledby="features-title">
              <h2 id="features-title">交互功能</h2>
              <div class="settings-card">
                <label class="setting-row" for="feature-enabled">
                  <span class="setting-copy">
                    <strong>弹幕功能增强 (+1 按钮)</strong>
                    <small>自动识别相似或重复的弹幕，并在播放器中显示快捷发送按钮。</small>
                  </span>
                  <input id="feature-enabled" type="checkbox" role="switch" aria-label="启用弹幕功能增强">
                </label>
                <label class="setting-row" for="altClick">
                  <span class="setting-copy">
                    <strong>Alt + 单击通用回退</strong>
                    <small>直播站点结构变化时，按住 Alt 单击弹幕仍可尝试快速复读。</small>
                  </span>
                  <input id="altClick" type="checkbox" role="switch">
                </label>
              </div>
            </section>

            <section id="platform-connections" class="settings-section" aria-labelledby="platforms-title">
              <h2 id="platforms-title">平台启用状态</h2>
              <div class="settings-card platform-card">
                <label class="platform-row" data-platform="bilibili">
                  <input id="platform-bilibili" class="platform-input" type="checkbox">
                  <span class="platform-identity">
                    <span class="platform-logo platform-logo--bilibili" aria-hidden="true">
                      <img src="../assets/icons/bilibili.svg" alt="">
                    </span>
                    <strong>Bilibili</strong>
                  </span>
                  <span class="platform-status">
                    <svg class="platform-status__on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 12 2.25 2.25 4.75-5"></path></svg>
                    <svg class="platform-status__off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8.5v4.25"></path><circle cx="12" cy="15.5" r=".55" class="filled"></circle></svg>
                    <span>已启用</span>
                  </span>
                </label>
                <label class="platform-row" data-platform="douyin">
                  <input id="platform-douyin" class="platform-input" type="checkbox">
                  <span class="platform-identity">
                    <span class="platform-logo platform-logo--douyin" aria-hidden="true">
                      <img src="../assets/icons/douyin.svg" alt="">
                    </span>
                    <strong>Douyin</strong>
                  </span>
                  <span class="platform-status">
                    <svg class="platform-status__on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 12 2.25 2.25 4.75-5"></path></svg>
                    <svg class="platform-status__off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8.5v4.25"></path><circle cx="12" cy="15.5" r=".55" class="filled"></circle></svg>
                    <span>已启用</span>
                  </span>
                </label>
                <label class="platform-row" data-platform="huya">
                  <input id="platform-huya" class="platform-input" type="checkbox">
                  <span class="platform-identity">
                    <span class="platform-logo platform-logo--huya" aria-hidden="true">
                      <img src="../assets/icons/huya.svg" alt="">
                    </span>
                    <strong>Huya</strong>
                  </span>
                  <span class="platform-status">
                    <svg class="platform-status__on" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="m8.5 12 2.25 2.25 4.75-5"></path></svg>
                    <svg class="platform-status__off" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8.5v4.25"></path><circle cx="12" cy="15.5" r=".55" class="filled"></circle></svg>
                    <span>已启用</span>
                  </span>
                </label>
              </div>
            </section>

            <section id="platform-colors" class="settings-section color-settings-section" aria-labelledby="colors-title">
              <div class="color-section-heading">
                <div>
                  <h2 id="colors-title">直播间颜色</h2>
                  <p>每个平台独立生效；留空或恢复默认时，继续使用插件内置颜色。</p>
                </div>
                <span class="color-count" id="color-count">0 项自定义</span>
              </div>
              <div class="color-platform-list">
                <details class="color-platform" data-color-platform="bilibili" open>
                  <summary>
                    <span class="color-platform__identity">
                      <img class="color-platform__mark" src="../assets/icons/bilibili.svg" alt="">
                      <span>
                        <strong>Bilibili</strong>
                        <small>使用默认颜色</small>
                      </span>
                    </span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"></path></svg>
                  </summary>
                  <div class="color-platform__body">
                    <div class="color-grid" data-color-grid="bilibili"></div>
                    <button class="platform-color-reset" type="button" data-reset-colors="bilibili">恢复 Bilibili 全部默认颜色</button>
                  </div>
                </details>

                <details class="color-platform" data-color-platform="douyin">
                  <summary>
                    <span class="color-platform__identity">
                      <img class="color-platform__mark" src="../assets/icons/douyin.svg" alt="">
                      <span>
                        <strong>Douyin</strong>
                        <small>使用默认颜色</small>
                      </span>
                    </span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"></path></svg>
                  </summary>
                  <div class="color-platform__body">
                    <div class="color-grid" data-color-grid="douyin"></div>
                    <button class="platform-color-reset" type="button" data-reset-colors="douyin">恢复 Douyin 全部默认颜色</button>
                  </div>
                </details>

                <details class="color-platform" data-color-platform="huya">
                  <summary>
                    <span class="color-platform__identity">
                      <img class="color-platform__mark" src="../assets/icons/huya.svg" alt="">
                      <span>
                        <strong>Huya</strong>
                        <small>使用默认颜色</small>
                      </span>
                    </span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"></path></svg>
                  </summary>
                  <div class="color-platform__body">
                    <div class="color-grid" data-color-grid="huya"></div>
                    <button class="platform-color-reset" type="button" data-reset-colors="huya">恢复 Huya 全部默认颜色</button>
                  </div>
                </details>
              </div>
            </section>

            <section class="settings-section upcoming-section" aria-labelledby="upcoming-title">
              <div class="section-heading">
                <h2 id="upcoming-title">实验室功能</h2>
                <span>即将上线</span>
              </div>
              <div class="settings-card upcoming-card" aria-disabled="true">
                <div class="setting-row">
                  <span class="setting-copy">
                    <strong class="bookmark-title">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5h9v15L12 16.75 7.5 19.5z"></path></svg>
                      弹幕一键收藏
                    </strong>
                    <small>保存精彩弹幕语录，支持跨设备同步与快速回溯。</small>
                  </span>
                  <span class="disabled-switch" aria-hidden="true"></span>
                </div>
              </div>
            </section>
          </div>
        </main>
      </section>
    </div>

    <p id="status" class="save-status" role="status" aria-live="polite">设置会自动保存</p>
    <script src="../src/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
